global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # cAdvisor - Container metrics (CPU, memory, network, disk)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # === VTTablet labels ===
      # Extract keyspace from: vitess-vttablet_article_shard1_primary-1
      - source_labels: [name]
        regex: 'vitess-vttablet_([^_]+)_.*'
        target_label: keyspace
        replacement: '${1}'
      # Extract shard
      - source_labels: [name]
        regex: 'vitess-vttablet_[^_]+_(shard[0-9]+)_.*'
        target_label: shard
        replacement: '${1}'
      # Extract role (primary/replica)
      - source_labels: [name]
        regex: 'vitess-vttablet_[^_]+_shard[0-9]+_([^-]+)-.*'
        target_label: role
        replacement: '${1}'
      
      # === VTGate labels ===
      # Extract cell from: vitess-vtgate_cell1-1
      - source_labels: [name]
        regex: 'vitess-vtgate_(cell[0-9]+)-.*'
        target_label: cell
        replacement: '${1}'
      
      # === Container group classification ===
      - source_labels: [name]
        regex: 'vitess-vttablet_.*'
        target_label: container_group
        replacement: 'vttablet'
      - source_labels: [name]
        regex: 'vitess-vtgate_.*'
        target_label: container_group
        replacement: 'vtgate'
      - source_labels: [name]
        regex: 'vitess-(vtctld|vtorc|vtadmin).*'
        target_label: container_group
        replacement: 'vtt_control'
      - source_labels: [name]
        regex: 'vitess-(prometheus|grafana|cadvisor|consul).*'
        target_label: container_group
        replacement: 'infrastructure'

  # VTGate metrics - query routing layer
  - job_name: vtgate
    metrics_path: /metrics
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '.*vtgate.*'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      # Extract cell from vtgate_cell1 -> cell1
      - source_labels: [__meta_docker_container_name]
        regex: '.*vtgate_(cell[0-9]+).*'
        target_label: cell
      - source_labels: [__meta_docker_network_ip]
        replacement: '${1}:8080'
        target_label: __address__

  # VTTablet metrics - per-shard database layer
  - job_name: vttablet
    metrics_path: /metrics
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '.*vttablet.*'
        action: keep
      # Extract keyspace, shard, role from vttablet_article_shard1_primary
      - source_labels: [__meta_docker_container_name]
        regex: '.*vttablet_([^_]+)_(shard[0-9]+)_([^-]+).*'
        target_label: keyspace
        replacement: '${1}'
      - source_labels: [__meta_docker_container_name]
        regex: '.*vttablet_([^_]+)_(shard[0-9]+)_([^-]+).*'
        target_label: shard
        replacement: '${2}'
      - source_labels: [__meta_docker_container_name]
        regex: '.*vttablet_([^_]+)_(shard[0-9]+)_([^-]+).*'
        target_label: role
        replacement: '${3}'
      # Short instance name: article_shard1_primary
      - source_labels: [__meta_docker_container_name]
        regex: '.*vttablet_([^-]+)-.*'
        target_label: instance
        replacement: '${1}'
      - source_labels: [__meta_docker_network_ip]
        replacement: '${1}:8080'
        target_label: __address__

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
  