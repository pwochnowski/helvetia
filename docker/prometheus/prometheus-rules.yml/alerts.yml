      # Container resource alerts
      - alert: HighTabletCPU
        expr: sum by (keyspace, shard, role) (rate(container_cpu_usage_seconds_total{container_group="vttablet"}[10s])) * 100 > 50
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on VTTablet"
          description: "Tablet {{ $labels.keyspace }}/{{ $labels.shard }} ({{ $labels.role }}) CPU usage is above 50% (current: {{ $value | printf \"%.1f\" }}%)."

